name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: ['backend/**', '.github/workflows/ci.yml']
            frontend: ['frontend/**', '.github/workflows/ci.yml']

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kebera
          POSTGRES_PASSWORD: kebera
          POSTGRES_DB: kebera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kebera" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KEBERA_TEST_DATABASE_URL: postgresql+psycopg://kebera:kebera@localhost:5432/kebera_test
      KEBERA_LOG_JSON: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (also checks that the migrations match the models)
        run: uv run pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # Builds both images and starts the whole stack, then checks the app answers through nginx.
  docker:
    needs: [backend, frontend]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 120
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"database":true'
          curl -fsS -X POST http://localhost:8080/api/engagements -H 'content-type: application/json' \
            -d '{"client_name":"Smoke Ltd","period_start":"2025-01-01","period_end":"2025-12-31"}' | grep -q '"status":"planning"'
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
