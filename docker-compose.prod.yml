# A server, with https from Let's Encrypt. Point the domain's DNS at the server, fill in .env
# (KEBERA_DOMAIN, POSTGRES_PASSWORD), then:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# To use a managed database instead of the bundled one, set KEBERA_DATABASE_URL and run with
# `--scale db=0` (the API and worker only need the URL).
services:
  caddy:  # https in front of the web app; certificates renew on their own
    image: caddy:2.10-alpine
    restart: unless-stopped
    command: caddy reverse-proxy --from ${KEBERA_DOMAIN:?set KEBERA_DOMAIN, e.g. app.kebera.com} --to web:80
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [web]

  web:
    ports: !reset []  # only reachable through caddy

  api:
    environment: &prod-env
      KEBERA_ENV: prod
      KEBERA_DATABASE_URL: ${KEBERA_DATABASE_URL:-postgresql+psycopg://kebera:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/kebera}
      KEBERA_CORS_ORIGINS: '["https://${KEBERA_DOMAIN}"]'
      KEBERA_PUBLIC_URL: https://${KEBERA_DOMAIN}
      KEBERA_COOKIE_SECURE: "1"
    ports: !reset []

  worker:
    environment: *prod-env

  migrate:
    environment: *prod-env

volumes:
  caddy_data:
  caddy_config:
